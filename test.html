<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Testing - jazhdo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/darkmode.css">
    <link rel="icon" href="/icon.png">
</head>
<body>
    <header>
        <div id="header-top">
            <a href="/" draggable="false" class="toptitle">jazhdo</a>
        </div>
        <nav>
            <a href="/" draggable="false" class="navbutton">Home</a>
            <a href="/blog/" draggable="false" class="navbutton">Blog</a>
            <a href="/contact.html" draggable="false" class="navbutton">Contact</a>
            <a href="/about.html" draggable="false" class="navbutton">About</a>
        </nav>
    </header>
    <div id="main">
        <h1>Test Page (H1 Element)</h1>
        <h2>H2 Element</h2>
        <p>This is a test page for testing purposes. (P Element)</p>

        <h2 class="counter">Counter</h2>
        <button id="disableCounter" onclick="disableCounterPreset()">Click to disable counter settings</button>
        <form id="counterForm">
            <label for="number">Type the number to start with if you want here.</label>
            <input type="number" id="presetCounter">
            <button type="submit">Click to set</button>
        </form>
        <button id="counterSettings" onclick="commaCounter()">Click to add/take away commas</button>
        <h2 class="counter" id="counterDisplay">0</h2>
        <div class="counter">
            <button class="counter" onclick="addCounter()">Add 1</button>
            <button class="counter" onclick="minusCounter()">Minus 1</button>
            <button class="counter" onclick="resetCounter()">Reset</button>
        </div>
        <img id="imgElement">
        <button onclick="fullScreen(document.getElementById('imgElement'))">Toggle fullscreen</button>
    </div>
    <footer>
        <h2 style="display: none;">Footer:</h2>
        <p id="darktest" class="footer">v0.2.2 - jazhdo</p>
        <a class="footer" href="/privacy.html">Privacy</a>
        <a class="footer" href="/terms.html">Terms</a>
        <script type="module" src="/backend.js"></script>
        <script src="/script.js"></script>
        <script src="/test.js"></script>
        <script src="/rpi-cam.js"></script>
    </footer>
</body>
</html>
