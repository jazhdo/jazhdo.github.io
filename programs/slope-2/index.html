<!doctype html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" href="style.css" />
        <link href="./splash.png" rel="shortcut icon" type="image/x-icon" />
        <title>Slope 2 - jazhdo</title>
    </head>
    <body style="width: 100%; height: 100%; margin: 0">
        <div id="unity-container" style="width: 100%; height: 100%; margin: 0" class="unity-desktop">
            <canvas id="unity-canvas" style="width: 100%; height: 100%; margin: 0"></canvas>
            <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                    <div id="unity-progress-bar-full"></div>
                </div>
            </div>
            <div id="unity-mobile-warning">WebGL builds are not supported on mobile devices.</div>
        </div>
        <script>
            var buildUrl = "Build";
            var loaderUrl = "./WebGL2Players v1.1.loader.js";
            var config = {
                dataUrl: "WebGL2Players v1.1.data.unityweb",
                frameworkUrl: "WebGL2Players v1.1.framework.js.unityweb",
                codeUrl: "WebGL2Players v1.1.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "Slope 2 Player",
                productVersion: "1",
            };

            var container = document.querySelector("#unity-container");
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var fullscreenButton = document.querySelector("#unity-fullscreen-button");
            var mobileWarning = document.querySelector("#unity-mobile-warning");

            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                // Avoid draining fillrate performance on mobile devices,
                // and default/override low DPI mode on mobile browsers.
                config.devicePixelRatio = 1;
                mobileWarning.style.display = "block";
                setTimeout(() => {
                    mobileWarning.style.display = "none";
                }, 5000);
            } else mobileWarning.style.display = "none";
            loadingBar.style.display = "block";

            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, progress => {
                    progressBarFull.style.width = 100 * progress + "%";
                })
                    .then(unityInstance => {
                        loadingBar.style.display = "none";
                        fullscreenButton.onclick = () => {
                            unityInstance.SetFullscreen(1);
                        };
                    })
                    .catch(message => {
                        console.log(message);
                    });
            };
            document.body.appendChild(script);
        </script>
        <script defer src="./sg.min.js"></script>
        <script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4905c6f34ad4495b80c8b7931780fc02","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
    </body>
</html>
