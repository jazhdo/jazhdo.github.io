    <style>
        .alert {
            padding: 20px;
            background-color: #0096FF;
            color: white;
        }

            p {text-align: center;}  
            font-weight: bold;
            float: right;
            font-size: 22px;
            line-height: 20px;
        cursor: pointer;
            transition: 0.3s;
        }

        .closebtn:hover {
            color: black;
        }
    </style>

<body style="margin: 0; overflow: hidden;">
