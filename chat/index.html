<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Chat - jazhdo</title>
    <link rel="stylesheet" href="/chat/chat.css">
    <link rel="icon" href="/icon.png">
</head>
<body>
    <header>
        <button id="menuIconButton">
            <div id="menuIcon"></div>
        </button>
        <a draggable="false" href="/" id="toptitle">jazhdo</a>
    </header>
    <div id="loadingScreen">
        <style>
            /* Loading screen from w3schools */
            #loadingScreen {
                border: 16px solid #f3f3f3;
                border-radius: 50%;
                border-top: 16px solid #3498db;
                width: 120px;
                height: 120px;
                -webkit-animation: spin 2s linear infinite;
                animation: spin 2s linear infinite;
                position: fixed;
                top: calc(50% - 60px);
                left: calc(50% - 60px);
            }
            @-webkit-keyframes spin {
                0% { -webkit-transform: rotate(0deg); }
                100% { -webkit-transform: rotate(360deg); }
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </div>
    <div id="main" style="display: none;">
        <div id="chatsBox">
            <div id="chatsTitle">
                <h1>Chats</h1>
            </div>
            <div id="chatsList">
                <div id="chatCreate">
                    <h2>Create new chat</h2>
                </div>
                <div id="chatBottom"></div>
            </div>
        </div>
        <div id="resizer"></div>
        <div id="messagesBox">
            <div id="chatBar" style="display: none;">
                <a id="chatTitle"></a>
                <!-- <a id="callChat">Call</a> -->
                <button id="settingsIconButton">
                    <div id="settingsIcon"></div>
                </button>
            </div>
            <div id="messages">
                <div id="messageBottom"></div>
            </div>
            <div id="typeBar" style="display: none;">
                <!-- Maybe add file attachment option -->
                <form id="typeForm">
                    <textarea placeholder="Type here.." id="typeInput"></textarea>
                    <button type="submit">Send</button>
                </form>
                <!-- Possibly add emoji selection menu -->
            </div>
        </div>
        <div id="callBox">
            <!-- In development until who knows when -->
        </div>
    </div>
    <footer style="display: none;">
        <h2 style="display: none;">Footer:</h2>
        <p id="darktest" class="footer">v0.2.5 - jazhdo</p>
        <a class="footer" href="/privacy.html">Privacy</a>
        <a class="footer" href="/terms.html">Terms</a>
        <script type="module" src="/chat/chat.js"></script>
        <script type="module" src="/chat/call.js"></script>
        <script src="/script.js"></script>
    </footer>
</body>
</html>
