<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Games - jazhdo</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/darkmode.css">
    <link rel="icon" href="/icon.png">
    <style>
        /* Game Icons' container */
        #games {
            display: flex;
            gap: 20px;
            font-size: 0px;
            justify-content: center;
            flex-wrap: wrap;
        }
        /* Game Icons */
        .game-icon {
            padding: 0px;
            border: 0.25vw rgba(0, 0, 0, 0.7) solid;
            border-radius: clamp(40px, 2vw, 100px);
            display: inline-block;
            overflow: hidden;
            position: relative;
        }
        .game-icon.darkmode {
            border-color: lightgray;
        }
        a.game-icon img {
            display: block;
            object-fit: cover;
            object-position: center;
            --cross-size: clamp(150px, 8vw, 300px);
            width: var(--cross-size);
            height: var(--cross-size);
        }
        span.game-name {
            opacity: 0;
            transition: opacity 0.3s;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: clamp(5px, 0.5vw, 10px) clamp(10px, 1vw, 20px);
            font-size: clamp(13px, 2.5vw, 20px);
            line-height: normal;
            text-align: center;
        }
        a.game-icon:hover {
            cursor: grab;
        }
        a.game-icon:hover span.game-name {
            opacity: 1;
        }
        /* Credits */
        #credits {
            width: 100vw;
            background-color: darkgray;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        footer {
            margin: 0px;
        }
        /* Game Display */
        #exit {
            position: fixed;
            font-size: 20px;
            margin: 0px;
            padding: 0px 5px;
            z-index: 1000000000;
            font-family: Arial, Helvetica, sans-serif;
        }
        #background {
            height: 100vw;
            width: 100vw;
            display: flex;
            align-items: center;
            position: fixed;
        }
        #game-view {
            position: fixed;
            height: 100vh;
            width: 100vw;
            top: 0px;
            left: 0px;
            z-index: 1000000;
            border: none;
        }
        /* In case device is touch and there is no hover */
        @media  (any-hover: none) {
            span.game-name {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <header>
        <div id="header-top">
            <a href="/" draggable="false" id="toptitle">jazhdo</a>
        </div>
        <nav>
            <a href="/" draggable="false" class="navbutton">Home</a>
            <a href="/blog/" draggable="false" class="navbutton">Blog</a>
            <a href="/contact.html" draggable="false" class="navbutton">Contact</a>
            <a href="/about.html" draggable="false" class="navbutton">About</a>
        </nav>
    </header>
    <div id="main">
        <h1 style="text-align: center;">Games</h1>
        <noscript>Please enable javascript to play games.</noscript>
        <div id="games">
        </div>
    </div>
    <div id="credits">
    </div>
    <footer>
        <h2 style="display: none;">Footer:</h2>
        <p id="darktest" class="footer">v0.2.3 - jazhdo</p>
        <a class="footer" href="/privacy.html">Privacy</a>
        <a class="footer" href="/terms.html">Terms</a>
        <script type="module" src="/backend.js"></script>
        <script src="/script.js"></script>
        <script>
            // Games list
            const games = {
                "Run3": {
                    url: "./run3/",
                    img: "./run3/img/menu/characterselection/RunnerFront.png",
                    credits: {
                        game: "https://github.com/lekug/lekug.github.io",
                        img: "https://github.com/lekug/lekug.github.io"
                    }
                },
                "Five Nights at Epstein's": {
                    url: "./Fnae/",
                    img: "./Fnae/icon.png",
                    credits: {
                        game: "https://github.com/n1yshi/Five-Nights-at-Epstein",
                        img: "https://img.itch.zone/aW1nLzI0NTkxMDM1LnBuZw==/360x286%23c/JxdlSn.png"
                    }
                },
                "EaglercraftX 1.8.8": {
                    url: "./EaglercraftX_1.8.html",
                    img: "./Eaglercraft.png",
                    credits: {
                        game: "https://eaglercraft.com/p/downloads/",
                        img: "https://eaglercraft.com/p/downloads/"
                    }
                },
                "EaglercraftX 1.8.8 WASM": {
                    url: "./EaglercraftX_1.8_WASM.html",
                    img: "./Eaglercraft.png",
                    credits: {
                        game: "https://eaglercraft.com/p/downloads/",
                        img: "https://eaglercraft.com/p/downloads/"
                    }
                },
                "Eaglercraft 1.12.2 WASM": {
                    url: "./Eaglercraft_1.12.2_WASM.html",
                    img: "./Eaglercraft.png",
                    credits: {
                        game: "https://eaglercraft.com/p/downloads/",
                        img: "https://eaglercraft.com/p/downloads/"
                    }
                },
                "Cloud Moon App": {
                    url: "https://cloudmoonapp.pages.dev",
                    img: "https://cloudmoonapp.pages.dev/images/logo.png",
                    credits: {
                        game: "https://cloudmoonapp.pages.dev",
                        img: "https://cloudmoonapp.pages.dev/images/logo.png"
                    }
                }
            };
            // Load games
            async function loadGames() {
                [...document.getElementsByClassName("game-icon")]?.forEach(e => e.remove());
                const sort = JSON.parse(localStorage.getItem('game-settings')).sort;
                const credits = document.getElementById('credits');
                const creditsTitle = document.createElement('h2');
                creditsTitle.textContent = 'Credits:';
                credits.append(creditsTitle);
                if (sort === "az") gamesSort = Object.keys(games).sort();
                else if (sort === "za") gamesSort = Object.keys(games).sort().reverse();
                else if (sort === "reverse") gamesSort = Object.keys(games).reverse();
                else gamesSort = Object.keys(games);
                if (gamesSort != Object.keys(games)) console.log("Sorted " + gamesSort.join(', ') + " by " + sort + ".");
                else console.log("Sorted " + gamesSort.join(', ') + " by no sorting.");
                gamesSort.forEach(key => {
                    const name = document.createElement("p");
                    const source = document.createElement("a");
                    const imgsrc = document.createElement("a");
                    const a = document.createElement("a");
                    const img = document.createElement("img");
                    const span = document.createElement("span");
                    const info = games[key];
                    name.textContent = key;
                    source.textContent = info.credits.game;
                    source.href = info.credits.game;
                    imgsrc.textContent = info.credits.img;
                    imgsrc.href = info.credits.img;
                    a.addEventListener("click", () => {
                        const background = document.createElement("div");
                        const view = document.createElement("iframe");
                        const exit = document.createElement("button");
                        exit.textContent = "X";
                        exit.id = "exit";
                        const corners = JSON.parse(localStorage.getItem('game-settings')).exitCorner.split('-');
                        if (corners[0] == "top") exit.style.top = '0px';
                        else if (corners[0] == "bottom") exit.style.bottom = '0px';
                        if (corners[1] == "left") exit.style.left = '0px';
                        else if (corners[1] == "right") exit.style.right = '0px';
                        exit.addEventListener("click", () => background.remove());
                        background.style.backgroundColor = getLightmode() ? "white" : "gray";
                        background.id = "background";
                        view.src = (info.url.startsWith("http") ? "" : "/games/") + info.url;
                        view.id = "game-view";
                        background.append(exit, view);
                        document.getElementById("main").after(background);
                    });
                    a.className = "game-icon";
                    if (!getLightmode()) a.classList.add("darkmode");
                    img.src = info.img;
                    span.className = "game-name";
                    span.textContent = key;
                    name.append(' Source: ', source, ' Image: ', imgsrc);
                    a.append(img, span);
                    document.getElementById("games").appendChild(a);
                    credits.append(name);
                });
            }
            loadGames();
            // Load credits
            (() => {
                const credits = document.getElementById('credits');

            })()
        </script>
    </footer>
</body>
</html>
